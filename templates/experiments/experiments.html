{% extends "base.html" %}

{% set pages = section.pages | sort(attribute="date") | reverse %}

{% block content %}

  <div class="about">
    <div class="about-inner">
      <h1>{{ section.title }}</h1>
    </div>
  </div>

  <div class="posts">
    <ul>
      {% for page in section.pages | sort(attribute="date") | reverse %}

        <li class="tag-list">
          <a href={{ page.permalink | safe }}>{{ page.title }}</a>
        </li>

      {% endfor %}
    </ul>
  </div>

{% endblock content %}
