{% extends "base.html" %}

{% block content %}

<div class="about">
  <div class="about-inner">
    <h1>All Tags</h1>
  </div>
</div>

<div class="posts">
  <ul>
    {% for term in terms %}

      {% set pages = term.pages | sort(attribute="date") | reverse %}
      <li class="tag-list">
        <a href={{ term.permalink | safe }}>{{ term.name }} ({{ term.pages | length }} post{{ term.pages | length | pluralize }})</a>
      </li>

    {% endfor %}
  </ul>
</div>

{% endblock content %}
