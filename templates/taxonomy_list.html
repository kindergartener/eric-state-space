{% extends "base.html" %}

{% block content %}
{{<section_header title="Tags" />}}
<ul class="tag-pyramid">
  {% for term in terms | sort(attribute="page_count") | reverse %}
  <li class="tag-pyramid-row">
    <a href="{{ term.permalink | safe }}">
      <span class="tag-pyramid-name">{{ term.name }}</span>
      <span class="tag-pyramid-hist">
        {% for n in range(end=term.page_count) %}
        <span class="tag-pyramid-square"></span>
        {% endfor %}
      </span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
