# The URL the site will be built for
base_url = "https://ericstate.space"
title = "eric state space"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

taxonomies = [{ name = "tags" }]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
highlight_theme = "kronuz"

[extra]
name = "Eric Fontes"

about = """
I'm a software developer and student at the University of Florida building programs for fun.
<br><br>
I'm interested in graphics, math, music, machine learning, creative coding, and cycling.
"""

socials = [
  {name = "Github", url = "https://github.com/kindergartener", newtab = true},
  {name = "Linkedin", url = "https://www.linkedin.com/in/eric-fontes", newtab = true},
  {name = "Email", url = "mailto:ericmf321@gmail.com"},
  {name = "Resume", url = "$BASE_URL/cv.pdf"}
]

picture = "images/eric.jpg"

quote = {text = "They've all done things, often beautiful things, in a context that was already set out before them, which they had no inclination to disturb. Without being aware of it, they've remained prisoners of those invisible and despotic circles which delimit the universe of a certain milieu in a given era. To have broken these bounds they would have had to rediscover in themselves that capability which was their birthright, as it was mine: the capacity to be alone.", author = "Alexander Grothendieck"}

# Put all your custom variables here
katex_enable = true
katex_auto_render = true

recent_posts = 10
summary_fallback_words = 240

menu_items = [
  {name = "blog", url = "$BASE_URL"},
  {name = "tags", url = "$BASE_URL/tags"},
  {name = "experiments", url = "$BASE_URL/experiments"},
  {name = "archive", url = "$BASE_URL/archive"}
]
